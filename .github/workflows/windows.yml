name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build, test and package
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Renderer build failed.' }
          npm run dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed.' }
      - name: Upload portable package
        uses: actions/upload-artifact@v6
        with:
          name: VioletFolders-win-x64
          path: |
            release/*.exe
            release/*.zip
            release/*.sha256
            release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: VioletFolders-win-x64
          path: release
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $files = @(Get-ChildItem -LiteralPath ./release -File | Where-Object { $_.Extension -in '.exe', '.zip', '.sha256' -or $_.Name -eq 'SHA256SUMS.txt' } | Select-Object -ExpandProperty FullName)
          if ($files.Count -eq 0) { throw 'No release packages were downloaded.' }
          gh release view $env:GITHUB_REF_NAME --json tagName 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @files --title "VioletFolders $env:GITHUB_REF_NAME" --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publishing failed.' }
